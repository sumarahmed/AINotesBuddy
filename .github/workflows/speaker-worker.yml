name: Speaker worker components

# Builds the isolated diarization subprocess (NotesBuddySpeakerWorker.exe /
# NotesBuddySpeakerWorkerGPU.exe) as a tracked, reproducible step. Neither
# variant was previously built by any CI workflow at all -- the currently
# pinned speaker-diarization release asset was built and uploaded by an
# undocumented manual process. This does not build the pyannote model
# itself (no HF_TOKEN/gating needed here); prepare_components.py's separate
# MODELS download step still supplies that, and the two dist/ outputs here
# are packaged into components with `prepare_components.py --speaker-runtime`
# / `--speaker-runtime-gpu` as a follow-up, still run locally.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            spec: NotesBuddySpeakerWorker.spec
            artifact: NotesBuddySpeakerWorker
          - variant: gpu
            spec: NotesBuddySpeakerWorkerGPU.spec
            artifact: NotesBuddySpeakerWorkerGPU

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/transcription/requirements-models.txt

      - name: Install worker build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/transcription/requirements-models.txt
          python -m pip install "pyinstaller>=6.11,<7"

      - name: Install CUDA-enabled torch (GPU variant only)
        if: matrix.variant == 'gpu'
        shell: pwsh
        run: |
          # pyannote.audio's own dependency resolution silently replaces an
          # explicitly CUDA-installed torch with a CPU-only build from
          # default PyPI the moment it (re-)resolves its own torch pin --
          # confirmed live (2026-09-05) chasing exactly this trap. Fix:
          # reinstall torch last, with --no-deps so pyannote's other already
          # -satisfied dependencies are untouched, from the CUDA wheel index,
          # pinned to whatever bare version requirements-models.txt's
          # pyannote.audio pin already resolved to above (not hardcoded,
          # since that resolution can drift as the pin changes over time).
          # --force-reinstall is required: PEP 440 local-version matching
          # means pip treats an installed "2.14.0+cpu" as already
          # satisfying a bare "torch==2.14.0" request, so without it pip
          # silently no-ops instead of fetching from the CUDA index at all
          # -- confirmed live (2026-09-05), a real CI run reported "torch
          # 2.14.0+cpu" after this step ran with no error.
          $torchVersion = python -c "import torch; print(torch.__version__.split('+')[0])"
          Write-Host "Reinstalling CUDA build of torch $torchVersion"
          python -m pip install --no-deps --force-reinstall --index-url https://download.pytorch.org/whl/cu126 "torch==$torchVersion"

      - name: Verify torch build
        shell: pwsh
        run: |
          $version = python -c "import torch; print(torch.__version__)"
          Write-Host "torch $version"
          if ("${{ matrix.variant }}" -eq "gpu" -and $version -notmatch "\+cu") {
            throw "Expected a CUDA-tagged torch build, got: $version"
          }
          if ("${{ matrix.variant }}" -eq "cpu" -and $version -notmatch "\+cpu") {
            throw "Expected a CPU-only torch build, got: $version"
          }

      - name: Build worker executable
        shell: pwsh
        run: |
          pyinstaller "desktop/${{ matrix.spec }}" `
            --distpath "desktop/out-${{ matrix.variant }}/dist" `
            --workpath "desktop/out-${{ matrix.variant }}/build" `
            --noconfirm

      - name: Self-test the built worker
        shell: pwsh
        run: |
          & "desktop/out-${{ matrix.variant }}/dist/${{ matrix.artifact }}/${{ matrix.artifact }}.exe" --self-test

      - name: Upload worker artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: desktop/out-${{ matrix.variant }}/dist/${{ matrix.artifact }}
          if-no-files-found: error
