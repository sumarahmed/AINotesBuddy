name: Repository check

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node:
          - 20
          - 24

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Validate source and production build
        run: npm test

  transcription-service:
    name: Local companion API
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            services/transcription/requirements-test.txt
            services/transcription/requirements-api.txt

      - name: Install API test dependencies
        run: python -m pip install -r services/transcription/requirements-test.txt

      - name: Validate timestamp alignment and local API
        run: |
          python -m py_compile services/transcription/desktop_app.py
          python -m py_compile desktop/prepare_models.py
          python -m py_compile services/transcription/modal_app.py
          python -m unittest discover -s services/transcription/tests -v
