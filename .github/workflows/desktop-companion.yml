name: Windows desktop companion

on:
  workflow_dispatch:
  push:
    tags:
      - "companion-v*"

permissions:
  contents: write

concurrency:
  group: desktop-companion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            services/transcription/requirements-packaging.txt
            services/transcription/requirements-desktop.txt
            services/transcription/requirements-models.txt

      - name: Install CPU PyTorch and packaging dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r services/transcription/requirements-packaging.txt

      - name: Prepare pinned faster-whisper CUDA runtime
        shell: pwsh
        run: |
          $assetApi = "https://api.github.com/repos/Purfview/whisper-standalone-win/releases/assets/236181970"
          $headers = @{
            Accept = "application/vnd.github+json"
            "User-Agent" = "NotesBuddy-Companion-Build"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $asset = Invoke-RestMethod -Uri $assetApi -Headers $headers
          if ($asset.name -ne "cuBLAS.and.cuDNN_CUDA12_win_v3.7z" -or $asset.size -ne 849141159) {
            throw "The pinned CUDA runtime asset metadata changed."
          }
          $archive = Join-Path $env:RUNNER_TEMP $asset.name
          Invoke-WebRequest -UseBasicParsing -Uri $asset.browser_download_url -OutFile $archive
          if ((Get-Item -LiteralPath $archive).Length -ne 849141159) {
            throw "The CUDA runtime download is incomplete."
          }
          $gpuLibs = Join-Path $env:GITHUB_WORKSPACE "desktop\gpu-libs"
          New-Item -ItemType Directory -Path $gpuLibs -Force | Out-Null
          7z x $archive "-o$gpuLibs" -y
          $required = @("cublas64_12.dll", "cudnn64_9.dll")
          foreach ($name in $required) {
            if (-not (Get-ChildItem -LiteralPath $gpuLibs -Filter $name -Recurse)) {
              throw "Pinned CUDA runtime is missing $name."
            }
          }
          Get-ChildItem -LiteralPath $gpuLibs -Filter "*.dll" -Recurse |
            Where-Object DirectoryName -ne $gpuLibs |
            Move-Item -Destination $gpuLibs -Force
          Remove-Item -LiteralPath $archive -Force

      - name: Prepare reusable component packs
        shell: pwsh
        run: |
          if (-not $env:HF_TOKEN) {
            throw "Add the gated-model read token as the repository secret HF_TOKEN."
          }
          $version = "${{ github.ref_name }}".Replace("companion-v", "")
          if (-not $version -or $version -eq "${{ github.ref_name }}") {
            $version = "2026.08.7"
          }
          python -m PyInstaller --noconfirm --clean --distpath desktop/out-speaker/dist --workpath desktop/out-speaker/work desktop/NotesBuddySpeakerWorker.spec
          & desktop/out-speaker/dist/NotesBuddySpeakerWorker/NotesBuddySpeakerWorker.exe --self-test
          if ($LASTEXITCODE -ne 0) {
            throw "The reusable speaker worker failed its packaged self-test."
          }
          python desktop/prepare_components.py --version $version --accept-pyannote-terms
          $speakerCheck = Join-Path $env:RUNNER_TEMP "notesbuddy-speaker-check"
          New-Item -ItemType Directory -Path $speakerCheck -Force | Out-Null
          $speakerArchive = Get-ChildItem desktop/components-release -Filter "NotesBuddy-speaker-diarization-*.zip" | Select-Object -First 1
          Expand-Archive -LiteralPath $speakerArchive.FullName -DestinationPath $speakerCheck -Force
          & (Join-Path $speakerCheck "NotesBuddySpeakerWorker.exe") --self-test --model (Join-Path $speakerCheck "model")
          if ($LASTEXITCODE -ne 0) {
            throw "The speaker component could not load its packaged model."
          }

      - name: Run service tests
        shell: pwsh
        run: python -m unittest discover -s services/transcription/tests -v

      - name: Ensure Inno Setup is available
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) {
            choco install innosetup --no-progress -y
          }

      - name: Build and self-test Windows installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".Replace("companion-v", "")
          if (-not $version -or $version -eq "${{ github.ref_name }}") {
            $version = "2026.08.7"
          }
          ./desktop/build.ps1 -Python python -Version $version

      - name: Upload installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: NotesBuddy-Windows-Companion
          path: |
            desktop/release/NotesBuddyCompanion-Setup-*.exe
            desktop/components-release/*.zip
          if-no-files-found: error

      - name: Publish tagged installer
        if: startsWith(github.ref, 'refs/tags/companion-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $installer = Get-ChildItem -LiteralPath desktop/release -Filter "NotesBuddyCompanion-Setup-*.exe" | Select-Object -First 1
          $assets = @($installer.FullName) + @(Get-ChildItem -LiteralPath desktop/components-release -Filter "*.zip" | ForEach-Object FullName)
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --generate-notes --title "NotesBuddy Desktop Companion $tag"
          }
