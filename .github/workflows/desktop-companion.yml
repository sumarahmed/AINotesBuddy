name: Windows desktop companion

on:
  workflow_dispatch:
  push:
    tags:
      - "companion-v*"

permissions:
  contents: write

concurrency:
  group: desktop-companion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            services/transcription/requirements-packaging.txt
            services/transcription/requirements-companion-core.txt
            services/transcription/requirements-api.txt

      - name: Install core companion packaging dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/transcription/requirements-packaging.txt

      - name: Verify pinned public component assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $manifest = Get-Content desktop/component-manifest.json -Raw | ConvertFrom-Json
          $releases = @{}
          foreach ($component in $manifest.components.PSObject.Properties.Value) {
            if ($component.url -notmatch '/releases/download/(?<tag>[^/]+)/(?<name>[^/]+)$') {
              throw "Component URL is not a versioned GitHub Release asset: $($component.url)"
            }
            $tag = $Matches.tag
            $name = $Matches.name
            if (-not $releases.ContainsKey($tag)) {
              $headers = @{
                Accept = "application/vnd.github+json"
                Authorization = "Bearer $env:GH_TOKEN"
                "X-GitHub-Api-Version" = "2022-11-28"
              }
              $releases[$tag] = Invoke-RestMethod `
                -Uri "https://api.github.com/repos/sumarahmed/AINotesBuddy/releases/tags/$tag" `
                -Headers $headers
            }
            $asset = $releases[$tag].assets | Where-Object name -eq $name | Select-Object -First 1
            if (-not $asset) {
              throw "Pinned component asset does not exist: $name"
            }
            if ($asset.size -ne $component.bytes) {
              throw "Pinned component size changed: $name"
            }
            if ($asset.digest -ne "sha256:$($component.sha256)") {
              throw "Pinned component checksum changed: $name"
            }
          }

      - name: Run service tests
        shell: pwsh
        run: python -m unittest discover -s services/transcription/tests -v

      - name: Ensure Inno Setup is available
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) {
            choco install innosetup --no-progress -y
          }

      - name: Build and self-test Windows installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".Replace("companion-v", "")
          if (-not $version -or $version -eq "${{ github.ref_name }}") {
            $version = "2026.09.07"
          }
          ./desktop/build.ps1 -Python python -Version $version
          Get-ChildItem desktop/release/NotesBuddyCompanion-Setup-*.exe |
            Select-Object Name, Length |
            Format-Table -AutoSize

      - name: Upload installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: NotesBuddy-Windows-Companion
          path: desktop/release/NotesBuddyCompanion-Setup-*.exe
          if-no-files-found: error

      - name: Publish tagged installer
        if: startsWith(github.ref, 'refs/tags/companion-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $installer = Get-ChildItem -LiteralPath desktop/release -Filter "NotesBuddyCompanion-Setup-*.exe" | Select-Object -First 1
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $installer.FullName --clobber
          } else {
            gh release create $tag $installer.FullName --generate-notes --title "NotesBuddy Desktop Companion $tag"
          }
