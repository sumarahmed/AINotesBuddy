name: Bug report
description: Report a reproducible NotesBuddy problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Use synthetic data only. Do not attach real meeting audio, confidential transcripts, credentials, or customer information.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open NotesBuddy using...
        2. Start...
        3. Click...
        4. Observe...
    validations:
      required: true

  - type: dropdown
    id: launch
    attributes:
      label: Launch method
      options:
        - Direct index.html (file://)
        - Development server
        - Production preview
        - Other
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: "Chrome 140"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11"
    validations:
      required: true

  - type: dropdown
    id: microphone
    attributes:
      label: Microphone permission
      options:
        - Allowed
        - Denied
        - Not requested
        - Not applicable
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Console output
      description: Paste relevant browser-console errors after removing sensitive data.
      render: shell

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I used synthetic data and removed sensitive information.
          required: true
